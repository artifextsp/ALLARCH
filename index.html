<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#B8860B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AllArch — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>
  <div class="aa-center-page">
    <div class="aa-card" style="width:100%;max-width:420px;">
      <div class="aa-card-header">
        <h1>🏛️ AllArch</h1>
        <p>Protegiendo el patrimonio arqueológico</p>
      </div>
      <div class="aa-card-body">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="aa-form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" class="aa-input" placeholder="tu@correo.com" required autocomplete="email" autofocus>
          </div>
          <div class="aa-form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="aa-input" placeholder="Tu contraseña" required autocomplete="current-password">
          </div>
          <button type="submit" id="loginBtn" class="aa-btn aa-btn-primary aa-btn-block aa-btn-lg">
            Iniciar Sesión
          </button>
        </form>

        <hr class="aa-divider">

        <div class="aa-text-center">
          <p class="aa-text-muted">¿No tienes cuenta?</p>
          <div class="aa-gap-sm aa-mt-1" style="justify-content:center;flex-wrap:wrap;">
            <a href="registro.html" class="aa-btn aa-btn-outline aa-btn-sm">Soy ciudadano</a>
            <a href="registro_arqueologo.html" class="aa-btn aa-btn-outline aa-btn-sm">Soy arqueólogo</a>
          </div>
        </div>

        <p class="aa-text-center aa-text-muted aa-mt-3" style="font-size:0.7rem;">
          AllArch — First Lego League 2026<br>Designed for archaeological heritage protection
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa-install.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    document.addEventListener('DOMContentLoaded', () => {
      const user = getUser();
      if (user && user.id) redirigirPorTipoUsuario();
    });
  </script>
</body>
</html>
