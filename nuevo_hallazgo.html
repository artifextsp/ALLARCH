<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#B8860B">
  <title>AllArch — Reportar Hallazgo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header class="aa-header" id="appHeader"></header>

  <main class="aa-page">
    <div class="aa-container" style="max-width:560px;">
      <h2 class="aa-section-title">📷 Reportar nuevo hallazgo</h2>
      <p class="aa-text-muted aa-mb-3">Sube hasta 3 fotografías del objeto y proporciona contexto para que un arqueólogo pueda evaluar su valor.</p>

      <form id="hallazgoForm" onsubmit="enviarHallazgo(event)">
        <div class="aa-form-group">
          <label>Fotografías (máximo 3)</label>
          <div class="aa-photo-grid" id="photoGrid">
            <div class="aa-photo-slot" onclick="agregarFoto(0)">
              <span>📷</span>
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="previewFoto(this, 0)">
            </div>
            <div class="aa-photo-slot" onclick="agregarFoto(1)">
              <span>＋</span>
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="previewFoto(this, 1)">
            </div>
            <div class="aa-photo-slot" onclick="agregarFoto(2)">
              <span>＋</span>
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="previewFoto(this, 2)">
            </div>
          </div>
        </div>

        <div class="aa-form-group">
          <label for="descripcion">Describe lo que encontraste</label>
          <textarea id="descripcion" class="aa-textarea" rows="3" placeholder="¿Qué es? ¿Cómo lo encontraste? ¿En qué contexto estaba?" required></textarea>
        </div>

        <div class="aa-form-group">
          <label for="contexto">¿Cómo fue el hallazgo?</label>
          <select id="contexto" class="aa-select" required>
            <option value="">Selecciona una opción</option>
            <option value="hallazgo_casual">Hallazgo casual (caminando, en un terreno...)</option>
            <option value="excavacion">Durante una excavación o construcción</option>
            <option value="coleccion_familiar">Pieza de colección familiar</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="aa-form-group">
          <label>Ubicación</label>
          <div class="aa-gap-sm" style="flex-wrap:wrap;">
            <button type="button" class="aa-btn aa-btn-outline aa-btn-sm" id="btnGPS" onclick="detectarUbicacion()">
              📍 Usar mi ubicación GPS
            </button>
            <span class="aa-text-muted" id="gpsStatus" style="align-self:center;font-size:0.8rem;"></span>
          </div>
          <input type="hidden" id="latitud">
          <input type="hidden" id="longitud">
          <div class="aa-mt-1">
            <input type="text" id="direccion" class="aa-input" placeholder="O escribe la dirección manualmente">
          </div>
        </div>

        <div class="aa-form-group">
          <label for="fechaHallazgo">¿Cuándo lo encontraste? (aproximado)</label>
          <input type="date" id="fechaHallazgo" class="aa-input">
        </div>

        <button type="submit" id="enviarBtn" class="aa-btn aa-btn-primary aa-btn-block aa-btn-lg aa-mt-2">
          Enviar hallazgo para evaluación
        </button>
      </form>

      <p class="aa-text-center aa-mt-2">
        <a href="dashboard_publico.html" class="aa-link">← Volver a mis hallazgos</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/hallazgo.js"></script>
  <script src="js/pwa-install.js"></script>
</body>
</html>
