<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#B8860B">
  <title>AllArch — Registro Arqueólogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div class="aa-center-page">
    <div class="aa-card" style="width:100%;max-width:480px;">
      <div class="aa-card-header" style="background:linear-gradient(135deg,var(--secondary) 0%,var(--secondary-light) 100%);">
        <h1>🏛️ AllArch</h1>
        <p>Registro de arqueólogo profesional</p>
      </div>
      <div class="aa-card-body">
        <p class="aa-text-muted aa-mb-2">Tu cuenta será revisada y aprobada por nuestro equipo administrador antes de poder evaluar hallazgos.</p>

        <form id="registroForm" onsubmit="registrarArqueologo(event)">
          <div class="aa-form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" class="aa-input" placeholder="Tu nombre" required>
          </div>
          <div class="aa-form-group">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" class="aa-input" placeholder="Tus apellidos" required>
          </div>
          <div class="aa-form-group">
            <label for="email">Correo electrónico institucional</label>
            <input type="email" id="email" class="aa-input" placeholder="tu@universidad.edu" required>
          </div>
          <div class="aa-form-group">
            <label for="institucion">Institución / Universidad</label>
            <input type="text" id="institucion" class="aa-input" placeholder="Universidad Nacional..." required>
          </div>
          <div class="aa-form-group">
            <label for="especializacion">Área de especialización</label>
            <input type="text" id="especializacion" class="aa-input" placeholder="Arqueología precolombina, cerámica..." required>
          </div>
          <div class="aa-form-group">
            <label for="anios">Años de experiencia</label>
            <input type="number" id="anios" class="aa-input" placeholder="5" min="0" max="60" required>
          </div>
          <div class="aa-form-group">
            <label for="telefono">Teléfono de contacto</label>
            <input type="tel" id="telefono" class="aa-input" placeholder="+57 300 123 4567" required>
          </div>
          <div class="aa-form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="aa-input" placeholder="Mínimo 4 caracteres" required minlength="4">
          </div>
          <div class="aa-form-group">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" id="password2" class="aa-input" placeholder="Repite tu contraseña" required>
          </div>
          <button type="submit" id="registroBtn" class="aa-btn aa-btn-secondary aa-btn-block aa-btn-lg">
            Solicitar registro
          </button>
        </form>
        <p class="aa-text-center aa-mt-2">
          <a href="index.html" class="aa-link">← Ya tengo cuenta</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function registrarArqueologo(event) {
      event.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const apellidos = document.getElementById('apellidos').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const institucion = document.getElementById('institucion').value.trim();
      const especializacion = document.getElementById('especializacion').value.trim();
      const anios = parseInt(document.getElementById('anios').value);
      const telefono = document.getElementById('telefono').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const btn = document.getElementById('registroBtn');

      if (password !== password2) {
        mostrarAlerta('Las contraseñas no coinciden', 'error');
        return;
      }

      btn.disabled = true;
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Registrando...';

      try {
        const check = await fetch(
          `${CONFIG.API_BASE}/usuarios?email=eq.${encodeURIComponent(email)}&select=id`,
          { headers: CONFIG.HEADERS }
        );
        const existing = await check.json();
        if (existing && existing.length > 0) {
          throw new Error('Ya existe una cuenta con este correo.');
        }

        const r = await fetch(`${CONFIG.API_BASE}/usuarios`, {
          method: 'POST',
          headers: { ...CONFIG.HEADERS, 'Prefer': 'return=representation' },
          body: JSON.stringify({
            email, password, nombre, apellidos, telefono,
            tipo_usuario: 'arqueologo', activo: true, aprobado: false,
            institucion, especializacion, anios_experiencia: anios
          })
        });

        if (!r.ok) throw new Error('Error al crear la cuenta.');

        mostrarAlerta('¡Solicitud enviada! Un administrador revisará tu perfil.', 'success', 4000);
        setTimeout(() => { window.location.href = 'index.html'; }, 4000);

      } catch (error) {
        mostrarAlerta(error.message, 'error');
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    }
  </script>
</body>
</html>
