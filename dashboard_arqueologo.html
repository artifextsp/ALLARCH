<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#B8860B">
  <title>AllArch — Panel Arqueólogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header class="aa-header" id="appHeader"></header>

  <main class="aa-page">
    <div class="aa-container">
      <div id="bannerPendiente" style="display:none;">
        <div class="aa-pending-banner">
          <h3>⏳ Cuenta pendiente de aprobación</h3>
          <p>Un administrador revisará tu perfil profesional. Recibirás acceso completo una vez aprobado.</p>
        </div>
      </div>

      <div id="contenidoPrincipal">
        <div class="aa-stats" id="statsArqueologo"></div>

        <div class="aa-tabs">
          <button class="aa-tab active" onclick="cambiarTab('pendientes')">⏳ Pendientes</button>
          <button class="aa-tab" onclick="cambiarTab('evaluados')">✅ Mis evaluaciones</button>
        </div>

        <div id="tabPendientes">
          <div id="listaPendientes">
            <div class="aa-loading"><div class="spinner"></div><span>Cargando hallazgos...</span></div>
          </div>
        </div>

        <div id="tabEvaluados" style="display:none;">
          <div id="listaEvaluados">
            <div class="aa-loading"><div class="spinner"></div><span>Cargando evaluaciones...</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/arqueologo.js"></script>
  <script src="js/pwa-install.js"></script>
</body>
</html>
